<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Живой Узор</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Noto+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --sand-light: #f4e9d8; --sand: #e0c9a6; --indigo: #2e3a59; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Sans', sans-serif; background: var(--sand-light); color: var(--indigo); line-height: 1.6; }
    .container { width: min(95%, 600px); margin: 40px auto; text-align: center; }
    .hero { padding: 20px; }
    .auth-box { margin: 40px auto; max-width: 300px; }
    .btn { background: var(--indigo); color: white; padding: 14px 32px; border-radius: 50px; text-decoration: none; display: inline-block; margin-top: 10px; }
    .upload-box { border: 3px dashed var(--sand); border-radius: 16px; padding: 40px; margin: 20px 0; cursor: pointer; }
  </style>
</head>
<body>

  <div class="hero">
    <h1>Живой Узор</h1>
    <p>Положите ладонь на песок.<br>Что сегодня просит быть увиденным?</p>
    
    <div class="auth-box" id="auth-container">
      <!-- VK Auth Widget появится здесь -->
      <div id="vk-auth"></div>
    </div>

    <div class="upload-zone" id="upload-zone" style="display:none">
      <div class="upload-box" id="drop-area">
        <p>🖼️ <strong>Загрузите фото узора</strong></p>
      </div>
    </div>
  </div>

  <script src="https://vk.com/js/api/openapi.js?169"></script>
  <script>
    // Инициализация VK API
    VK.init({ apiId: 54394370 });

    // Показываем кнопку входа
    VK.Widgets.Auth("vk-auth", {
      width: 220,
      onAuth: function(data) {
        if (data.session) {
          const vk_id = data.session.mid;
          const name = data.settings.first_name || 'Друг';
          localStorage.setItem('vk_id', vk_id);
          document.querySelector('h1').innerText = `Добро пожаловать, ${name} 🌙`;
          document.getElementById('auth-container').style.display = 'none';
          document.getElementById('upload-zone').style.display = 'block';
        }
      }
    });
  </script>

</body>
</html>
